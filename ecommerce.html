<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.eu.amplitude.com/script/9e96ce9e23c5ab1b715986dbe87a1ac1.js"></script><script>window.amplitude.add(window.sessionReplay.plugin({sampleRate: 1}));window.amplitude.init('9e96ce9e23c5ab1b715986dbe87a1ac1', {"fetchRemoteConfig":true,"serverZone":"EU","autocapture":true});</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Second-Hand Treasures</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script defer>
    let basket = [];
    let currentStep = 0;
    let currentView = 'clothes';

    const articles = {
      clothes: [
        { id: 'cl_001', name: 'T-Shirt', price: 15.99, category: 'clothes', description: 'Comfortable cotton t-shirt', brand:'Trish', sku:'1234', quantity:'' },
        { id: 'cl_002', name: 'Trousers', price: 29.99, category: 'clothes', description: 'Smart casual trousers', brand:'Sourt", sku:'2341', quantity:' },
        { id: 'cl_003', name: 'Pants', price: 19.99, category: 'clothes', description: 'Comfortable everyday pants'brand:'Stamp", sku:'3412', quantity:' },
        { id: 'cl_004', name: 'Hat', price: 12.99, category: 'clothes', description: 'Stylish baseball cap', brand:'Tah", sku:'4123', quantity:' },
        { id: 'cl_005', name: 'Shoes', price: 49.99, category: 'clothes', description: 'Comfortable walking shoes', brand:'Seoh", sku:'4321', quantity:' }
      ],
      electronics: [
        { id: 'el_001', name: 'TV', price: 299.99, category: 'electronics', description: '32-inch LED TV', brand:'Vit", sku:'5678', quantity:' },
        { id: 'el_002', name: 'Laptop', price: 599.99, category: 'electronics', description: 'Refurbished laptop', brand:'Potpal", sku:'6785', quantity:' },
        { id: 'el_003', name: 'Mouse', price: 19.99, category: 'electronics', description: 'Wireless optical mouse', brand:'Soum", sku:'7856', quantity:' },
        { id: 'el_004', name: 'Keyboard', price: 39.99, category: 'electronics', description: 'Mechanical keyboard', brand:'Yek", sku:'8567', quantity:' },
        { id: 'el_005', name: 'Phone', price: 199.99, category: 'electronics', description: 'Smartphone in good condition',brand:'Eno", sku:'8765', quantity:' },
        { id: 'el_006', name: 'Charger', price: 9.99, category: 'electronics', description: 'Universal phone charger', brand:'Regra", sku:'7658', quantity:' }
      ]
    };

    function renderItems() {
      const container = document.getElementById('main');
      container.innerHTML = `
        <div class="flex justify-around mb-4">
          <button onclick="switchView('clothes')" class="bg-blue-500 text-white px-4 py-2 rounded">Clothes</button>
          <button onclick="switchView('electronics')" class="bg-blue-500 text-white px-4 py-2 rounded">Electronics</button>
          <button onclick="nextStep()" class="bg-green-500 text-white px-4 py-2 rounded">View Basket</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
          ${articles[currentView].map(product => `
            <div onclick="addToBasket('${product.id}')" class="bg-gray-100 p-4 text-center rounded shadow cursor-pointer hover:bg-gray-200">
              <h3 class="font-bold">${product.name}</h3>
              <p class="text-sm text-gray-600 mb-2">${product.description}</p>
              <p class="text-lg font-semibold text-green-600">$${product.price}</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function switchView(view) {
      currentView = view;
      renderItems();
    }

    function findProductById(productId) {
      for (let category in articles) {
        const product = articles[category].find(p => p.id === productId);
        if (product) return product;
      }
      return null;
    }

    function addToBasket(productId) {
      const product = findProductById(productId);
      if (product) {
        basket.push(product);
        // Track "Added to Basket" event
       {
      product_id: product.id,
      product_name: product.name,
      price: product.price,
      category: product.category,
      brand: product.brand, 
      sku: product.sku,     
      quantity: 1           
    }
  ],
  basket_size: basket.length
});
        alert(`${product.name} added to basket.`);
      }
    }

    function renderBasket() {
      const container = document.getElementById('main');
      const totalPrice = basket.reduce((sum, product) => sum + product.price, 0);
      
      container.innerHTML = `
        <h2 class="text-xl font-bold mb-4">Your Basket</h2>
        ${basket.map((product, index) => `
          <div class="flex justify-between items-center mb-2 p-2 bg-white rounded shadow">
            <div>
              <span class="font-medium">${product.name}</span>
              <span class="text-sm text-gray-600 ml-2">$${product.price}</span>
            </div>
            <button onclick="removeFromBasket(${index})" class="bg-red-500 text-white px-2 py-1 rounded">Remove</button>
          </div>
        `).join('')}
        <div class="mt-4 p-4 bg-green-100 rounded">
          <p class="text-lg font-bold">Total: $${totalPrice.toFixed(2)}</p>
        </div>
        <button onclick="confirmDetails()" class="bg-green-500 text-white px-4 py-2 mt-4 rounded">Confirm Details</button>
      `;
    }

    function removeFromBasket(index) {
      basket.splice(index, 1);
      renderBasket();
    }

    function confirmDetails() {
      const totalPrice = basket.reduce((sum, product) => sum + product.price, 0);
      // Track "Details Confirmed" event
      window.amplitude.track('Details Confirmed', {
        basket_items: basket.map(p => ({ id: p.id, name: p.name, price: p.price })),
        total_items: basket.length,
        total_value: totalPrice
      });
      nextStep();
    }

    function renderDetailsForm() {
      const container = document.getElementById('main');
      container.innerHTML = `
        <input id="firstName" placeholder="First Name" class="block w-full mb-4 p-2 border rounded" />
        <input id="lastName" placeholder="Last Name" class="block w-full mb-4 p-2 border rounded" />
        <input id="address" placeholder="Address" class="block w-full mb-4 p-2 border rounded" />
        <button onclick="nextStep()" class="bg-green-500 text-white px-4 py-2 rounded">Select Payment</button>
      `;
    }

    function selectPayment(method) {
      const totalPrice = basket.reduce((sum, product) => sum + product.price, 0);
      // Track "Payment Made" event
      window.amplitude.track('Payment Made', {
        payment_method: method,
        basket_items: basket.map(p => ({ id: p.id, name: p.name, price: p.price })),
        total_items: basket.length,
        total_value: totalPrice
      });
      nextStep();
    }

    function renderPaymentOptions() {
      const container = document.getElementById('main');
      const totalPrice = basket.reduce((sum, product) => sum + product.price, 0);
      
      container.innerHTML = `
        <div class="mb-4 p-4 bg-blue-100 rounded">
          <h3 class="font-bold mb-2">Order Summary</h3>
          <p class="text-lg">Total: $${totalPrice.toFixed(2)}</p>
        </div>
        ${['Apple Pay', 'Card', 'Cash Online'].map(method => `
          <button onclick="selectPayment('${method}')" class="w-full mb-4 bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">${method}</button>
        `).join('')}
      `;
    }

    function renderSuccess() {
      const container = document.getElementById('main');
      container.innerHTML = `
        <h2 class="text-2xl font-bold mb-4 text-center">Transaction Successful!</h2>
        <p class="text-center">Thank you for supporting sustainable second-hand shopping!</p>
      `;
    }

    function renderStep() {
      switch (currentStep) {
        case 0: return renderItems();
        case 1: return renderBasket();
        case 2: return renderDetailsForm();
        case 3: return renderPaymentOptions();
        case 4: return renderSuccess();
      }
    }

    function nextStep() {
      currentStep++;
      renderStep();
    }

    function previousStep() {
      currentStep = Math.max(currentStep - 1, 0);
      renderStep();
    }

    window.onload = renderStep;
  </script>
</head>
<body class="bg-gray-50 p-4">
  <div class="max-w-xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <button onclick="previousStep()" class="text-blue-500">&larr; Back</button>
      <h1 class="text-2xl font-bold text-center flex-grow">♻️ Second-Hand Treasures</h1>
    </div>
    <div id="main"></div>
  </div>
</body>
</html>
